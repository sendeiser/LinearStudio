# Netlify Configuration for LinearStudio
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Public client-side Vite environment variables are bundled into dist/ by design.
  # Disable Netlify secrets scan or omit keys so public VITE_ keys do not fail the build.
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_GITHUB_TOKEN"

# Single Page Application (SPA) redirect rule
# Ensures client-side routing and page refreshes work properly without 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for immutable Vite production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
