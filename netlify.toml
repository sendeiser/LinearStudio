# Netlify Configuration for LinearStudio
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirect rule
# Ensures client-side routing and page refreshes work properly without 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for immutable Vite production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
